type: folder
name: System Reset and Mode
items:
- type: ccm
  id: 200
  name: GM1 System On
  memo: Sets the GM bank system.
  data: '@SYSEX F0H 7EH 7FH 09H 01H F7H'
  color: E00000
- type: ccm
  id: 201
  name: GM System Off
  memo: Resets and returns SpessaSynth to GS mode.
  data: '@SYSEX F0H 7EH 7FH 09H 02H F7H'
  color: E00000
- type: ccm
  id: 202
  name: GM2 System On
  memo: Default bank MSB becomes 121.
  data: '@SYSEX F0H 7EH 7FH 09H 03H F7H'
  color: E00000
- type: ccm
  id: 203
  name: GS Reset
  memo: DT1 40 00 7F, data 00. Device ID fixed at 10H.
  sysex:
    profile: gs
    address: 40H 00H 7FH
    payload: 00H
  color: E00000
- type: ccm
  id: 204
  name: GS Double Module Mode
  memo: Resets and makes sure the synth has at least 32 channels.
  sysex:
    profile: gs
    address: 40H 00H 7FH
    payload: 01H
  color: E00000
- type: ccm
  id: 205
  name: XG System On
  memo: Resets and sets XG mode.
  data: '@SYSEX F0H 43H 10H 4CH 00H 00H 7EH 00H F7H'
  color: E00000
- type: ccm
  id: 206
  name: XG All Parameter Reset
  memo: Resets and sets XG mode.
  data: '@SYSEX F0H 43H 10H 4CH 00H 00H 7FH 00H F7H'
  color: E00000
