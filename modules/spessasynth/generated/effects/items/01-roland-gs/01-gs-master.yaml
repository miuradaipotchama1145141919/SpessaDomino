type: folder
name: GS Master
items:
- type: ccm
  id: 300
  name: Master Tune
  sync: Last
  value:
    default: 0
    min: -1000
    max: 1000
    offset: 1024
    name: 0.1 cent
  memo: 'Four nibbles, most significant first. Wire value is 1024 plus the tuning. Assumes #VF1 is the lowest nibble.'
  sysex:
    profile: gs
    address: 40H 00H 00H
    payload: '#VF4 #VF3 #VF2 #VF1'
  color: '900000'
- type: ccm
  id: 301
  name: Master Volume
  sync: Last
  value:
    default: 127
    max: 127
  sysex:
    profile: gs
    address: 40H 00H 04H
    payload: '#VL'
  color: '900000'
- type: ccm
  id: 302
  name: Master Key Shift
  sync: Last
  value:
    default: 0
    min: -64
    max: 63
    offset: 64
    name: Semitones
  memo: Range -24 to +24 on real GS hardware.
  sysex:
    profile: gs
    address: 40H 00H 05H
    payload: '#VL'
  color: '900000'
- type: ccm
  id: 303
  name: Master Pan
  sync: Last
  value:
    default: 64
    min: 1
    max: 127
  memo: 64 is center.
  sysex:
    profile: gs
    address: 40H 00H 06H
    payload: '#VL'
  color: '900000'
