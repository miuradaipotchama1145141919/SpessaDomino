  sync: Last
  value:
    default: 0
    min: 0
    max: 16383
    tableId: 17
  memo: Only the types SpessaSynth implements are listed. Any other type passes the signal dry (Thru). Value is MSB*128+LSB.
  sysex:
    profile: gs
    address: 40H 03H 00H
    payload: '#VH #VL'
