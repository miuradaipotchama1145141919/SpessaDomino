type: folder
name: GS Drum Setup Map 2
items:
- type: ccm
  id: 390
  name: Play Note Number (pitch coarse) (Map 2)
  sync: LastEachGate
  value:
    default: 0
    min: -64
    max: 63
    offset: 64
    name: Semitones
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: 50 cent resolution on SC-88 and later (bank LSB other than 1), 100 cents on SC-55 (LSB 1).
  sysex:
    profile: gs
    address: '41H 11H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 391
  name: Level (Map 2)
  sync: LastEachGate
  value:
    default: 120
    max: 127
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: Normalized to 120. Gain is (data/120) squared in 4.4.0 and data/120 in stable builds.
  sysex:
    profile: gs
    address: '41H 12H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 392
  name: Assign Group Number (Map 2)
  sync: LastEachGate
  value:
    default: 0
    max: 127
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: Overrides the exclusive class.
  sysex:
    profile: gs
    address: '41H 13H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 393
  name: Panpot (Map 2)
  sync: LastEachGate
  value:
    default: 64
    max: 127
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: 0 is random. In 4.4.0 a value of 64 leaves the channel pan unchanged.
  sysex:
    profile: gs
    address: '41H 14H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 394
  name: Reverb Send Level (Map 2)
  sync: LastEachGate
  value:
    default: 127
    max: 127
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  sysex:
    profile: gs
    address: '41H 15H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 395
  name: Chorus Send Level (Map 2)
  sync: LastEachGate
  value:
    default: 0
    max: 127
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  sysex:
    profile: gs
    address: '41H 16H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 396
  name: Rx. Note Off (Map 2)
  sync: LastEachGate
  value:
    default: 0
    min: 0
    max: 1
    tableId: 16
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: On forces the drum note to end at Note Off. Off by default.
  sysex:
    profile: gs
    address: '41H 17H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 397
  name: Rx. Note On (Map 2)
  sync: LastEachGate
  value:
    default: 1
    min: 0
    max: 1
    tableId: 16
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: Off disables the drum instrument.
  sysex:
    profile: gs
    address: '41H 18H #GL'
    payload: '#VL'
  color: C06000
- type: ccm
  id: 398
  name: Delay Send Level (Map 2)
  sync: LastEachGate
  value:
    default: 0
    max: 127
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  sysex:
    profile: gs
    address: '41H 19H #GL'
    payload: '#VL'
  color: C06000
