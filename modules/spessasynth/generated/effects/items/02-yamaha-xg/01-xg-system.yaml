type: folder
name: XG System
items:
- type: ccm
  id: 500
  name: Master Tune
  sync: Last
  value:
    default: 0
    min: -1000
    max: 1000
    offset: 1024
    name: 0.1 cent
  memo: Four nibbles, most significant first. Wire value is 1024 plus the tuning.
  sysex:
    profile: xg
    address: 00H 00H 00H
    payload: '#VF4 #VF3 #VF2 #VF1'
  color: '900000'
- type: ccm
  id: 501
  name: Master Volume
  sync: Last
  value:
    default: 127
    max: 127
  sysex:
    profile: xg
    address: 00H 00H 04H
    payload: '#VL'
  color: '900000'
- type: ccm
  id: 502
  name: Master Attenuator
  sync: Last
  value:
    default: 0
    max: 127
  memo: Inverted master volume. 0 is no attenuation.
  sysex:
    profile: xg
    address: 00H 00H 05H
    payload: '#VL'
  color: '900000'
- type: ccm
  id: 503
  name: Master Transpose
  sync: Last
  value:
    default: 0
    min: -64
    max: 63
    offset: 64
    name: Semitones
  sysex:
    profile: xg
    address: 00H 00H 06H
    payload: '#VL'
  color: '900000'
