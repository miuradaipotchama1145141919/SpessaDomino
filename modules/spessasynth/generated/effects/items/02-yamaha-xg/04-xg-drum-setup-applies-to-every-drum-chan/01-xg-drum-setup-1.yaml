    default: 0
    min: -64
    max: 63
    offset: 64
    name: Semitones
  gate:
    default: 36
    min: 0
    max: 127
    name: Drum Note
    type: Key
  memo: 100 cent steps.
  sysex:
    profile: xg
    address: '30H #GL 00H'
