[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SpessaDomino"
version = "0.0.8"
description = "Domino sound source definition for SpessaSynth, built with DominoDefBuilder"
requires-python = ">=3.10"
dependencies = ["DominoDefBuilder>=0.4.0", "pyyaml>=6"]
