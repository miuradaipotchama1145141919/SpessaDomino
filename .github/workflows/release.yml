name: release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/genAll.py
      - name: Rebuild every variant with the tag as the module version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/buildVariants.py --version "${TAG#v}"
      - name: Pack the generated sources
        run: cd modules/spessasynth && zip -qr ../../dist/generated.zip generated
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.xml dist/manifest.json dist/generated.zip --title "$TAG" --generate-notes --verify-tag
